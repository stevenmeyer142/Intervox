/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
}

application {
    mainClass = 'com.brazedblue.intervox.main.NSAppletFrameDev' 
       applicationDefaultJvmArgs = ["-Djava.library.path=${buildDir}/lib"]

}


dependencies {
    implementation 'javax.vecmath:vecmath:1.5.2'
    implementation 'org.rxtx:rxtx:2.1.7'
    implementation 'gov.nist.math:jama:1.0.3'
}


group = 'com.brazedblue.intervox'
version = '1.0-SNAPSHOT'
description = 'Intervox'
def cmake_preset = 'vcpkg' // 'vcpkg' or 'default'
def native_dir = 'src/main/native'
def jni_build_subdir = "build/${cmake_preset}"
def jni_build_dir = "${native_dir}/${jni_build_subdir}"
java.sourceCompatibility = JavaVersion.VERSION_1_8

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-h', // This flag tells javac to generate JNI header files
        file("${native_dir}"), // Specify the output directory for the headers
    ]

        dependsOn("makeJniBuildDir")
        finalizedBy("JniCMake")
}

task JniCMake  (type: Exec) {
        // Set environment variables if needed
        if ("${cmake_preset}" == "vcpkg") {
           environment "VCPKG_ROOT", "/Users/stevenmeyer/Projects/vcpkg"
        }
     	workingDir getProjectDir().getAbsolutePath() + "/${native_dir}"
    	
        println "Running cmake --preset ${cmake_preset} in " + getProjectDir().getAbsolutePath() + "/${native_dir}"
        commandLine 'cmake',  "--preset", "${cmake_preset}", '.'
        finalizedBy("JniBuild")
}

task JniBuild  (type: Exec) {
        workingDir getProjectDir().getAbsolutePath() + "/${jni_build_dir}"
        println "Running cmake --build in " + getProjectDir().getAbsolutePath() + "/${jni_build_dir}"
        commandLine 'cmake',  '--build', "."
}


task makeJniBuildDir {
    println "Making JNI build dir at " + getProjectDir().getAbsolutePath() + "/${jni_build_dir}"
   mkdir getProjectDir().getAbsolutePath() + "/${jni_build_dir}"
}

tasks
tasks.register('copyData', Copy) {
    from getProjectDir().getAbsolutePath() + "/${native_dir}/data",getProjectDir().getAbsolutePath() + "/data"
    into "${buildDir}/data"
}

tasks.register('copyJniLibs', Copy) {
    println "Copying JNI libs... from " + getProjectDir().getAbsolutePath() +  "/${jni_build_dir}" + " to " + "${buildDir}/lib"
    from getProjectDir().getAbsolutePath() +  "/${jni_build_dir}"
    into "${buildDir}/lib"
    include '*.dylib','*.so','*.dll'
}

